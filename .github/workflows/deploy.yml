name: Deploy Laravel to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@master

        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}

          script: |

            cd /var/www/Maw-Buket

            echo "=== Enable Maintenance Mode ==="
            php artisan down || true

            echo "=== Pull Latest Code ==="
            git pull origin main

            echo "=== Install Composer Dependencies ==="
            composer install --no-interaction --prefer-dist --optimize-autoloader

            echo "=== Install NPM Dependencies ==="
            npm install

            echo "=== Build Vite Assets ==="
            npm run build

            echo "=== Fix Laravel Permissions ==="
            chmod -R 775 storage bootstrap/cache
            chown -R www-data:www-data storage bootstrap/cache

            echo "=== Clear Old Cache ==="
            php artisan optimize:clear

            echo "=== Run Database Migration ==="
            php artisan migrate --force

            echo "=== Rebuild Docker Image ==="
            docker build --no-cache -t maw-app:latest .

            echo "=== Redeploy Docker Swarm Stack ==="
            docker stack deploy -c docker-compose.yml mawstack

            echo "=== Force Restart Services ==="
            docker service update --force mawstack_app
            docker service update --force mawstack_nginx

            echo "=== Wait Container Ready ==="
            sleep 15

            echo "=== Clear Laravel Cache Inside Container ==="

            CONTAINER_ID=$(docker ps --filter "ancestor=maw-app:latest" -q | head -n 1)

            docker exec $CONTAINER_ID php artisan optimize:clear
            docker exec $CONTAINER_ID php artisan view:clear
            docker exec $CONTAINER_ID php artisan config:clear
            docker exec $CONTAINER_ID php artisan route:clear
            docker exec $CONTAINER_ID php artisan cache:clear

            echo "=== Rebuild Laravel Cache ==="
            docker exec $CONTAINER_ID php artisan optimize

            echo "=== Disable Maintenance Mode ==="
            docker exec $CONTAINER_ID php artisan up

            echo "=== Remove Unused Docker Resources ==="
            docker image prune -af
            docker container prune -f

            echo "=== Deployment Finished Successfully ==="
