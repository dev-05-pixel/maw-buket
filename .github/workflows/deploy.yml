name: Deploy Laravel to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 40m
          script: |
            set -e

            cd /var/www/Maw-Buket

            echo "=== FIX PROJECT OWNERSHIP ==="
            sudo chown -R $USER:$USER /var/www/Maw-Buket

            echo "=== PULL LATEST CODE ==="
            git fetch origin main
            git reset --hard origin/main

            echo "=== ENSURE HOME VIEW EXISTS (FALLBACK) ==="
            mkdir -p resources/views
            if [ ! -f resources/views/home.blade.php ]; then
                cat > resources/views/home.blade.php << 'EOF'
            @extends('layouts.app')
            @section('title', 'Beranda')
            @push('styles')
                <link rel="stylesheet" href="{{ asset('css/general/home.css') }}">
            @endpush
            @section('content')
                <h1>Selamat Datang di Maw Bouquet</h1>
            @endsection
            EOF
            fi

            echo "=== SET PERMISSION 777 (TEMPORARY) ==="
            sudo chmod -R 777 storage bootstrap/cache

            echo "=== COMPOSER & NPM ==="
            composer install --no-interaction --prefer-dist --optimize-autoloader
            npm install
            npm run build

            echo "=== CLEAR LARAVEL CACHE (HOST) ==="
            php artisan view:clear
            php artisan config:clear
            php artisan route:clear
            php artisan view:cache

            echo "=== MIGRATE DATABASE ==="
            php artisan migrate --force

            echo "=== REBUILD DOCKER IMAGE ==="
            docker build -t maw-app:latest .

            echo "=== DEPLOY SWARM STACK ==="
            docker stack deploy -c docker-compose.yml mawstack

            echo "=== FIX PERMISSION & CACHE INSIDE CONTAINER ==="
            CONTAINER_ID=$(docker ps -qf "name=mawstack_app")
            if [ ! -z "$CONTAINER_ID" ]; then
                docker exec $CONTAINER_ID chmod -R 777 /var/www/storage /var/www/bootstrap/cache
                docker exec $CONTAINER_ID php artisan view:clear
                docker exec $CONTAINER_ID php artisan config:clear
                docker exec $CONTAINER_ID php artisan route:clear
                docker exec $CONTAINER_ID php artisan view:cache
            fi

            echo "=== CLEANUP ==="
            docker image prune -af || true

            echo "=== DEPLOYMENT SUCCESS ==="
