name: Deploy Laravel to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 40m
          script: |
            set -e

            cd /var/www/Maw-Buket

            echo "=== FIX PROJECT OWNERSHIP (HOST) ==="
            sudo chown -R $USER:$USER /var/www/Maw-Buket

            echo "=== CURRENT COMMIT BEFORE PULL ==="
            git log --oneline -1

            echo "=== FETCH LATEST CODE ==="
            git fetch origin main

            echo "=== RESET TO REMOTE MAIN ==="
            git reset --hard origin/main

            echo "=== CURRENT COMMIT AFTER PULL ==="
            git log --oneline -1

            echo "=== ENSURE HOME VIEW EXISTS ==="
            if [ ! -f resources/views/home.blade.php ]; then
                mkdir -p resources/views
                cat > resources/views/home.blade.php << 'EOF'
            @extends('layouts.app')

            @section('content')
            <div class="container">
                <h1>Selamat Datang di Maw Bouquet</h1>
                <p>Toko bunga online terpercaya.</p>
            </div>
            @endsection
            EOF
            fi

            echo "=== CLEAN OLD DOCKER CACHE ==="
            docker system prune -af || true
            docker builder prune -af || true

            echo "=== INSTALL COMPOSER DEPENDENCIES ==="
            composer install \
              --no-interaction \
              --prefer-dist \
              --optimize-autoloader

            echo "=== INSTALL NPM DEPENDENCIES ==="
            npm install

            echo "=== BUILD VITE ASSETS ==="
            npm run build

            echo "=== FIX LARAVEL PERMISSIONS (USE UID 33) ==="
            sudo chown -R 33:33 storage bootstrap/cache
            sudo chmod -R 775 storage bootstrap/cache
            sudo chmod -R 775 storage/logs

            echo "=== CLEAR LARAVEL CACHE (HOST) ==="
            php artisan view:clear
            php artisan config:clear
            php artisan route:clear

            echo "=== RUN DATABASE MIGRATION ==="
            php artisan migrate --force

            echo "=== OPTIMIZE LARAVEL ==="
            php artisan optimize

            echo "=== REBUILD DOCKER IMAGE ==="
            docker build -t maw-app:latest .

            echo "=== RESTART DOCKER SWARM STACK ==="
            docker stack deploy -c docker-compose.yml mawstack

            echo "=== FIX PERMISSIONS INSIDE CONTAINER ==="
            CONTAINER_ID=$(docker ps -qf "name=mawstack_app")
            if [ ! -z "$CONTAINER_ID" ]; then
                docker exec $CONTAINER_ID chown -R 33:33 /var/www/storage /var/www/bootstrap/cache
                docker exec $CONTAINER_ID chmod -R 775 /var/www/storage /var/www/bootstrap/cache
                docker exec $CONTAINER_ID php artisan view:clear
                docker exec $CONTAINER_ID php artisan config:cache
            fi

            echo "=== REMOVE DANGLING IMAGES ==="
            docker image prune -af || true

            echo "=== DEPLOYMENT FINISHED SUCCESSFULLY ==="
