name: Deploy Laravel to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 40m

          script: |

            set -e

            cd /var/www/Maw-Buket

            echo "=== FIX PROJECT OWNERSHIP ==="
            sudo chown -R $USER:$USER /var/www/Maw-Buket

            echo "=== CURRENT COMMIT BEFORE PULL ==="
            git log --oneline -1

            echo "=== FETCH LATEST CODE ==="
            git fetch origin main

            echo "=== RESET TO REMOTE MAIN ==="
            git reset --hard origin/main

            echo "=== CURRENT COMMIT AFTER PULL ==="
            git log --oneline -1

            echo "=== CLEAN OLD DOCKER CACHE ==="
            docker system prune -af || true
            docker builder prune -af || true

            echo "=== INSTALL COMPOSER DEPENDENCIES ==="
            composer install \
              --no-interaction \
              --prefer-dist \
              --optimize-autoloader

            echo "=== INSTALL NPM DEPENDENCIES ==="
            npm install

            echo "=== BUILD VITE ASSETS ==="
            npm run build

            echo "=== FIX LARAVEL PERMISSIONS ==="
            sudo chown -R www-data:www-data storage bootstrap/cache
            sudo chmod -R 775 storage bootstrap/cache

            echo "=== CLEAR OLD LARAVEL CACHE ==="
            php artisan optimize:clear

            echo "=== RUN DATABASE MIGRATION ==="
            php artisan migrate --force

            echo "=== OPTIMIZE LARAVEL ==="
            php artisan optimize

            echo "=== REBUILD DOCKER IMAGE ==="
            docker build -t maw-app:latest .

            echo "=== RESTART DOCKER SWARM STACK ==="
            docker stack deploy -c docker-compose.yml mawstack

            echo "=== REMOVE DANGLING IMAGES ==="
            docker image prune -af || true

            echo "=== DEPLOYMENT FINISHED SUCCESSFULLY ==="
