name: Deploy Laravel to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 40m

          script: |

            set -e

            cd /var/www/Maw-Buket

            echo "=== CURRENT COMMIT BEFORE PULL ==="
            git log --oneline -1

            echo "=== PULL LATEST CODE ==="
            git fetch origin main
            git reset --hard origin/main

            echo "=== CURRENT COMMIT AFTER PULL ==="
            git log --oneline -1

            echo "=== INSTALL COMPOSER ==="
            composer install --no-interaction --prefer-dist --optimize-autoloader

            echo "=== INSTALL NPM ==="
            npm install

            echo "=== BUILD VITE ==="
            npm run build

            echo "=== FIX PERMISSION ==="
            sudo chown -R www-data:www-data storage bootstrap/cache
            sudo chmod -R 775 storage bootstrap/cache

            echo "=== CLEAR CACHE ==="
            php artisan optimize:clear

            echo "=== MIGRATE DATABASE ==="
            php artisan migrate --force

            echo "=== OPTIMIZE LARAVEL ==="
            php artisan optimize

            echo "=== REBUILD DOCKER APP IMAGE ==="
            docker build -t maw-app:latest .

            echo "=== RESTART DOCKER STACK ==="
            docker stack deploy -c docker-compose.yml mawstack

            echo "=== DONE ==="
