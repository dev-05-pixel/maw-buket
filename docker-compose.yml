version: '3.8'

services:

  app:
    image: maw-app:latest
    ports:
      - "9100:9100"
    volumes:
      - ./:/var/www
      - ./storage:/var/www/Maw-Buket/storage
      - ./bootstrap/cache:/var/www/Maw-Buket/bootstrap/cache
    networks:
      - maw-network
    deploy:
      replicas: 1

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - maw-network
    deploy:
      replicas: 1

  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    networks:
      - maw-network
    deploy:
      replicas: 1

  redis_exporter:
    image: oliver006/redis_exporter:latest
    environment:
      REDIS_ADDR: redis://redis:6379
    ports:
      - "9121:9121"
    depends_on:
      - redis
    networks:
      - maw-network
    deploy:
      replicas: 1

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - maw-network
    deploy:
      replicas: 1

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    networks:
      - maw-network
    deploy:
      replicas: 1

  node_exporter:
    image: prom/node-exporter:latest
    ports:
      - "9101:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
    networks:
      - maw-network
    deploy:
      mode: global

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    networks:
      - maw-network
    deploy:
      mode: global

networks:
  maw-network:
    external: true
    name: mawstack_maw-network
